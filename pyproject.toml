[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "page-optimizer"
version = "0.1.0"
description = "Markdown document renderer and ReAct visual layout optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Page Optimizer Contributors" }]
dependencies = [
  "Pillow>=10",
  "PyYAML>=6",
  "pypdfium2>=4",
  "reportlab>=4",
  "requests>=2"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
page-optimizer = "page_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["page_optimizer*"]
exclude = ["docs*", "examples*", "patches*", "prompts*", "renders*", "tests*", "themes*"]

[tool.pytest.ini_options]
pythonpath = [".", ".deps"]
testpaths = ["tests"]
